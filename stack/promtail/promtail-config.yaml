server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    pipeline_stages:
      - docker: {}

  - job_name: hermes-audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: hermes-audit
          __path__: /audit/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            kind: kind
            actor: actor
      - labels:
          kind:
          actor:
      - timestamp:
          source: ts
          format: RFC3339Nano
